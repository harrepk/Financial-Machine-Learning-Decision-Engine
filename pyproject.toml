[project]
name = "financial-decision-engine"
version = "1.0.0"
description = "Full-stack ML app that matches credit cards to a plain-English search and predicts approval odds."
authors = [{ name = "Harre Prakash Kumar" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]  # pycodestyle, pyflakes, isort, bugbear, pyupgrade

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    # Newer Starlette prefers the `httpx2` package for TestClient; plain `httpx` still works everywhere.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
